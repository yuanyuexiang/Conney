[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=45,<49",
    "defusedxml>=0.7,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy",
    "pytest",
    "ruff",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
